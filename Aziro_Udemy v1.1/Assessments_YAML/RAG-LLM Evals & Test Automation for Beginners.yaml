- id: q1_rag_architecture
  question: In a RAG architecture, what is the primary purpose of the 'Retrieval'
    component?
  options:
    A: To generate human-like text responses based on a prompt.
    B: To identify and extract relevant documents from a knowledge base.
    C: To fine-tune the LLM for specific downstream tasks.
    D: To translate user queries into a format understandable by the LLM.
  correct_answer: B
- id: q2_context_precision
  question: A RAG system returns a context containing irrelevant information alongside
    the correct answer. How would this most significantly impact the Context Precision
    metric?
  options:
    A: Increase Context Precision, as more information is provided.
    B: Decrease Context Precision, as irrelevant information dilutes the score.
    C: Have no impact, as Context Precision only measures answer correctness.
    D: Increase Context Recall, as more context is retrieved.
  correct_answer: B
- id: q3_faithfulness
  question: You observe low Faithfulness scores in your RAG evaluation. What is the
    most likely underlying issue?
  options:
    A: The LLM is unable to generate coherent responses.
    B: The LLM is hallucinating or generating information not supported by the retrieved
      context.
    C: The retrieval component is failing to find relevant documents.
    D: The evaluation dataset is poorly constructed.
  correct_answer: B
- id: q4_pytest_fixtures
  question: Why are Pytest fixtures particularly useful when evaluating LLMs with
    RAGAS?
  options:
    A: They allow for dynamic test data generation.
    B: They help manage and reuse common resources like OpenAI API connections and
      LLM wrappers, reducing code duplication.
    C: They automatically generate evaluation reports.
    D: They simplify the process of uploading metrics to the RAGAS dashboard.
  correct_answer: B
- id: q5_parameterization
  question: You want to test your RAG system with multiple different user queries.
    How can Pytest parameterization help you achieve this efficiently?
  options:
    A: By automatically generating new test cases based on existing ones.
    B: By allowing you to run the same test function with different input data without
      code duplication.
    C: By creating separate test files for each query.
    D: By dynamically adjusting the LLM's parameters during testing.
  correct_answer: B
