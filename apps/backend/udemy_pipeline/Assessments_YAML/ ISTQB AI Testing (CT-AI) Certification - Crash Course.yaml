    C: Recall.
    D: F1-Score.
  correct_answer: C
- id: q4_neural_networks
  question: A deep neural network is exhibiting vanishing gradients during training.
    What technique could help mitigate this issue?
  options:
    A: Increasing the learning rate.
    B: Using ReLU activation functions.
    C: Decreasing the number of layers.
    D: Applying batch normalization.
  correct_answer: D
