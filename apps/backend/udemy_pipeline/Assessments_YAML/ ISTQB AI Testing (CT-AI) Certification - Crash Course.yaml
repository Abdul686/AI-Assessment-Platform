- id: q1_ml_lifecycle
  question: During the 'Training' phase of the ML lifecycle, a tester observes consistently
    low performance on the validation dataset despite good performance on the training
    dataset. What is the MOST likely issue?
  options:
    A: Data poisoning attack.
    B: Overfitting to the training data.
    C: Insufficient data labeling.
    D: Underfitting due to a simple model.
  correct_answer: B
- id: q2_bias_ethics
  question: An AI system used for loan applications consistently denies loans to applicants
    from a specific zip code. What type of bias is MOST likely present?
  options:
    A: Algorithmic bias.
    B: Sample bias.
    C: Inappropriate bias.
    D: Reward hacking.
  correct_answer: B
- id: q3_performance_metrics
  question: In a medical diagnosis AI system, minimizing false negatives is critical.
    Which performance metric should be prioritized?
  options:
    A: Precision.
