  question: How does FSDP reduce memory consumption during LLM training?
  options:
    A: By reducing the precision of the model weights.
    B: By sharding the model parameters across multiple devices.
    C: By increasing the batch size.
    D: By eliminating the need for gradient accumulation.
  correct_answer: B
- id: q50_llm_generation_control
  question: What is the purpose of 'top-p' sampling (nucleus sampling) in LLM text
