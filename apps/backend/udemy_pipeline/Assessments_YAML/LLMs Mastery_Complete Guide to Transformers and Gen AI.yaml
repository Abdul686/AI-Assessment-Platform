- id: q1_nlp_evolution
  question: A company is building a sentiment analysis tool. Initially, they used
    a rule-based system with manually defined keywords. Performance is poor due to
    nuanced language. Which NLP era would best address this limitation?
  options:
    A: Rule-Based Systems Era
    B: Machine Learning Era
    C: Statistical Era
    D: Embeddings Era
  correct_answer: B
- id: q2_transformer_attention
  question: In a Transformer model, what is the primary function of the attention
    mechanism?
  options:
    A: To reduce the dimensionality of the input sequence.
    B: To allow the model to focus on different parts of the input sequence when processing
      each element.
    C: To perform non-linear transformations on the input data.
    D: To accelerate the training process by parallelizing computations.
  correct_answer: B
- id: q3_pretraining_finetuning
  question: 'You have a pre-trained BERT model. You want to adapt it for a specific
    task: classifying customer support tickets. What is the most appropriate approach?'
  options:
    A: Retrain BERT from scratch on the customer support ticket data.
    B: Freeze all BERT layers and train a new classification layer on top.
    C: Fine-tune the entire BERT model on the customer support ticket data.
    D: Only fine-tune the embedding layer of BERT.
  correct_answer: C
- id: q4_tokenizer_impact
  question: A tokenizer splits the sentence 'I love LLMs!' into ['I', 'love', 'LL',
    'Ms', '!']. What potential issue does this illustrate?
  options:
    A: The tokenizer is too efficient and reduces sequence length unnecessarily.
    B: The tokenizer is failing to recognize common subword units, potentially impacting
      model performance.
    C: The tokenizer is correctly handling punctuation but struggling with capitalization.
    D: The tokenizer is designed for a different language than English.
  correct_answer: B
- id: q5_bert_gpt_t5
  question: You need a model to generate creative text formats, like poems or code.
    Which Transformer model is generally best suited for this task?
  options:
    A: BERT
    B: GPT
    C: T5
    D: All models perform equally well.
  correct_answer: B
- id: q6_semantic_search
  question: When building a semantic search index using Transformers, what is the
    primary goal of the embeddings?
  options:
    A: To reduce the computational cost of searching.
    B: To represent the meaning of text in a vector space, allowing for similarity
      comparisons.
    C: To tokenize the text into individual words.
    D: To translate the text into a different language.
  correct_answer: B
- id: q7_llm_decoding
  question: What is the core process involved in 'decoding' within the context of
    Large Language Models?
  options:
    A: Converting text data into numerical representations.
    B: Generating text sequentially, predicting the next token based on previous tokens.
    C: Compressing the model's parameters to reduce memory usage.
    D: Evaluating the model's performance on a validation dataset.
  correct_answer: B
- id: q8_rlhf_impact
  question: What is the primary benefit of using Reinforcement Learning from Human
    Feedback (RLHF) in training LLMs?
  options:
    A: To increase the model's training speed.
    B: To align the model's outputs with human preferences and instructions.
    C: To reduce the model's computational requirements.
    D: To improve the model's ability to perform mathematical calculations.
  correct_answer: B
- id: q9_chat_templates
  question: Why are chat templates important when interacting with LLMs?
  options:
    A: They reduce the model's memory requirements.
    B: They provide a structured format for input and output, guiding the model's
      responses.
    C: They automatically correct grammatical errors in the input.
    D: They encrypt the communication between the user and the model.
  correct_answer: B
- id: q10_llm_selection
  question: You need an LLM for a task requiring high factual accuracy and minimal
    creativity. Which factor should be prioritized during model selection?
  options:
    A: Model size (number of parameters).
    B: Training data diversity.
    C: Performance on relevant benchmark datasets.
    D: Inference speed.
  correct_answer: C
- id: q11_sequence_length
  question: 'Increasing the sequence length during LLM training generally leads to:'
  options:
    A: Reduced computational cost.
    B: Improved ability to capture long-range dependencies, but increased memory requirements.
    C: Faster training convergence.
    D: Decreased model accuracy.
  correct_answer: B
- id: q12_token_counts
  question: A model has a vocabulary size of 30,000 tokens. What impact does a larger
    vocabulary generally have?
  options:
    A: Reduced model size.
    B: Increased model capacity to represent diverse language, but higher memory usage.
    C: Faster inference speed.
    D: Improved generalization to unseen data.
  correct_answer: B
- id: q13_numerical_precision
  question: What is the trade-off when reducing numerical precision (e.g., from FP32
    to FP16) during LLM training?
  options:
    A: Increased accuracy, but higher memory usage.
    B: Reduced memory usage and faster training, but potential loss of precision and
      stability.
    C: Slower training, but improved accuracy.
    D: No significant impact on performance.
  correct_answer: B
- id: q14_peft_lora
  question: What is the primary advantage of using Parameter-Efficient Fine-Tuning
    (PEFT) techniques like LoRA?
  options:
    A: They require significantly more computational resources than full fine-tuning.
    B: They reduce the number of trainable parameters, making fine-tuning more efficient
      and less memory-intensive.
    C: They guarantee higher accuracy than full fine-tuning.
    D: They eliminate the need for a pre-trained model.
  correct_answer: B
- id: q15_gradient_accumulation
  question: Why is gradient accumulation used during LLM training?
  options:
    A: To reduce the learning rate.
    B: To simulate a larger batch size when memory is limited.
    C: To improve the model's generalization ability.
    D: To accelerate the training process.
  correct_answer: B
- id: q16_8bit_training
  question: What is the main benefit of using 8-bit training for large language models?
  options:
    A: It significantly increases model accuracy.
    B: It reduces memory consumption, allowing you to train larger models on limited
      hardware.
    C: It speeds up the training process by a factor of two.
    D: It eliminates the need for gradient accumulation.
  correct_answer: B
- id: q17_flash_attention
  question: How does FlashAttention improve the efficiency of Transformer models?
  options:
    A: By reducing the number of layers in the model.
    B: By optimizing the attention mechanism to reduce memory access and computation.
    C: By using a different activation function.
    D: By increasing the sequence length.
  correct_answer: B
- id: q18_qlora
  question: QLoRA builds upon LoRA by adding what key feature?
  options:
    A: Increased model size.
    B: Quantization to 4-bit precision.
    C: Removal of the attention mechanism.
    D: Full fine-tuning of all model parameters.
  correct_answer: B
- id: q19_deepspeed_overview
  question: What is the primary goal of DeepSpeed?
  options:
    A: To simplify the model architecture.
    B: To enable efficient training of extremely large models that wouldn't fit on
      a single GPU.
    C: To improve the accuracy of the model.
    D: To reduce the training time for small models.
  correct_answer: B
- id: q20_fsdp_implementation
  question: 'Fully Sharded Data Parallel (FSDP) achieves scalability by:'
  options:
    A: Replicating the entire model on each GPU.
    B: Sharding the model parameters across multiple GPUs.
    C: Reducing the precision of the model parameters.
    D: Using a smaller batch size.
  correct_answer: B
- id: q21_encoder_decoder_role
  question: In an encoder-decoder Transformer model, what is the primary role of the
    encoder?
  options:
    A: To generate the output sequence.
    B: To process the input sequence and create a contextualized representation.
    C: To translate the output sequence into a different language.
    D: To reduce the dimensionality of the input sequence.
  correct_answer: B
- id: q22_t5_text_to_text
  question: What distinguishes T5 from BERT and GPT in terms of its training approach?
  options:
    A: T5 only supports English language.
    B: T5 frames all NLP tasks as text-to-text problems.
    C: T5 requires less computational resources.
    D: T5 is only suitable for classification tasks.
  correct_answer: B
- id: q23_mlm_objective
  question: What is the primary objective of Masked Language Modeling (MLM) used in
    BERT's pre-training?
  options:
    A: To predict the next word in a sequence.
    B: To reconstruct randomly masked words in a sentence.
    C: To translate text from one language to another.
    D: To generate creative text formats.
  correct_answer: B
- id: q24_gpt_instruct
  question: What is 'GPT Instruct' designed to improve?
  options:
    A: The model's ability to perform mathematical calculations.
    B: The model's responsiveness to instructions and its ability to follow directions.
    C: The model's speed of inference.
    D: The model's ability to handle long sequences.
  correct_answer: B
- id: q25_extractive_qa
  question: BERT is particularly well-suited for what type of question answering?
  options:
    A: Generative question answering (creating new answers).
    B: Extractive question answering (identifying the answer within a given text).
    C: Multiple-choice question answering.
    D: Open-ended question answering.
  correct_answer: B
- id: q26_adapter_merging
  question: What is the benefit of merging adapters after LoRA training?
  options:
    A: It reduces the model size.
    B: It allows for combining knowledge from multiple tasks without significant overhead.
    C: It improves the model's training speed.
    D: It eliminates the need for fine-tuning.
  correct_answer: B
- id: q27_gpu_selection
  question: When selecting a GPU for LLM training, which factor is most critical?
  options:
    A: The GPU's clock speed.
    B: The amount of GPU memory (VRAM).
    C: The GPU's core count.
    D: The GPU's power consumption.
  correct_answer: B
- id: q28_batch_size_impact
  question: How does increasing the batch size during LLM training generally affect
    the training process?
  options:
    A: It always leads to faster convergence.
    B: It can lead to more stable gradients and faster training, but requires more
      memory.
    C: It always leads to lower accuracy.
    D: It has no significant impact on the training process.
  correct_answer: B
- id: q29_checkpointing_benefit
  question: What is the primary purpose of gradient checkpointing?
  options:
    A: To improve the accuracy of the model.
    B: To reduce memory usage during training by recomputing activations.
    C: To accelerate the training process.
    D: To prevent overfitting.
  correct_answer: B
- id: q30_flash_attention_memory
  question: FlashAttention primarily addresses which bottleneck in Transformer models?
  options:
    A: Computational complexity of the feedforward layers.
    B: Memory access patterns during attention calculation.
    C: The size of the embedding layer.
    D: The number of layers in the model.
  correct_answer: B
- id: q31_llm_input_output
  question: What is a key challenge in managing the input/output processes of LLMs?
  options:
    A: Ensuring the model always generates grammatically correct text.
    B: Handling the limited context window and maintaining coherence over long sequences.
    C: Preventing the model from accessing external data sources.
    D: Reducing the model's computational cost.
  correct_answer: B
- id: q32_model_selection_framework
  question: When building a model selection framework for LLMs, what is a crucial
