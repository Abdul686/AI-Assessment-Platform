  question: What is a key architectural difference between BERT and GPT?
  options:
    A: BERT is a decoder-only model, while GPT is an encoder-only model.
    B: BERT is an encoder-only model, while GPT is a decoder-only model.
    C: Both models use the same architecture.
    D: BERT is only used for text generation, while GPT is only used for text understanding.
