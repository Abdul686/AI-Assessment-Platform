  options:
    A: Model size (number of parameters).
    B: Inference latency and cost.
    C: The programming language used to implement the model.
    D: The number of training examples used.
  correct_answer: B
- id: q33_generation_techniques
  question: What is the purpose of techniques like temperature scaling in LLM text
    generation?
  options:
    A: To reduce the model's memory usage.
    B: To control the randomness and creativity of the generated text.
    C: To improve the model's accuracy.
    D: To accelerate the generation process.
  correct_answer: B
- id: q34_task_specific_training
  question: Why is task-specific training important even after pre-training and fine-tuning?
  options:
    A: To reduce the model's size.
    B: To optimize the model for a specific application and improve performance on
      that task.
    C: To eliminate the need for RLHF.
    D: To make the model more generalizable.
  correct_answer: B
- id: q35_memory_management
  question: What is a common strategy for managing memory limitations during LLM training?
  options:
    A: Increasing the batch size.
    B: Using mixed precision training (e.g., FP16).
    C: Reducing the sequence length.
    D: Both B and C.
  correct_answer: D
- id: q36_deepseed_data_parallelism
  question: How does DeepSpeed achieve data parallelism?
  options:
    A: By replicating the entire model on each device.
    B: By partitioning the model and data across multiple devices.
    C: By reducing the precision of the model weights.
    D: By using a smaller batch size.
  correct_answer: B
- id: q37_fsdp_communication
  question: What is a key challenge addressed by FSDP regarding communication between
