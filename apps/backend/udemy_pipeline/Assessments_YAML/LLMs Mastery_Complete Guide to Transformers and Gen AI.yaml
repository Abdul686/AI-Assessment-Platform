- id: q41_t5_application
  question: 'T5''s text-to-text format makes it particularly well-suited for:'
  options:
    A: Only translation tasks.
    B: A wide range of NLP tasks with a unified approach.
    C: Only question answering.
    D: Only sentiment analysis.
