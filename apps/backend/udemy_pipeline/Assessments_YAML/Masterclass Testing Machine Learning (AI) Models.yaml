- id: q1_intro_ai
  question: An AI-powered medical diagnosis system consistently misdiagnoses a rare
    disease. Beyond accuracy metrics, what is the MOST critical ethical consideration?
  options:
    A: The cost of retraining the model.
    B: Potential harm to patients due to incorrect diagnoses.
    C: The impact on the AI development team's reputation.
    D: The system's computational resource usage.
  correct_answer: B
- id: q2_testing_basics
