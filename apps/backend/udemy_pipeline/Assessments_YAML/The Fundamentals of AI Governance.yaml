- id: q1_ai_lifecycle
  question: During the AI lifecycle, a data scientist discovers significant bias in
    the training data. Which stage is the MOST appropriate to address this issue?
  options:
    A: Model Deployment
    B: Data Collection & Preparation
    C: Model Evaluation
    D: Model Monitoring
  correct_answer: B
- id: q2_generative_ai
  question: A generative AI model consistently produces outputs that reinforce harmful
    stereotypes. What is the primary ethical concern?
  options:
    A: Lack of transparency in the model's architecture.
    B: Violation of user privacy.
    C: Perpetuation of unfairness and bias.
    D: Intellectual property infringement.
  correct_answer: C
- id: q3_ethics_vs_laws
  question: An AI system performs an action that is technically legal but widely considered
    unethical. What is the key distinction to consider?
  options:
    A: Laws are always more important than ethical considerations.
    B: Ethics represent a broader set of moral principles than codified laws.
    C: Legal compliance automatically guarantees ethical behavior.
    D: Ethical concerns are irrelevant if an action is legal.
  correct_answer: B
- id: q4_ai_privacy
  question: You are building an AI model to predict customer churn. What privacy principle
    is MOST relevant when handling Personally Identifiable Information (PII)?
  options:
    A: Transparency
    B: Accountability
    C: Data Minimization
    D: Fairness
  correct_answer: C
- id: q5_ai_transparency
  question: A black-box AI model denies a loan application. A customer requests an
    explanation. What is the challenge related to transparency in this scenario?
  options:
    A: The model's decision-making process is not easily interpretable.
    B: The customer does not understand the concept of AI.
    C: The loan application was incomplete.
    D: The bank is not legally obligated to provide an explanation.
  correct_answer: A
- id: q6_ai_accountability
  question: An autonomous vehicle causes an accident. Who is MOST likely to be held
    accountable from an ethical perspective?
  options:
    A: The vehicle's manufacturer.
    B: The AI algorithm developer.
    C: The vehicle owner.
    D: All of the above, depending on the circumstances.
  correct_answer: D
- id: q7_ai_fairness
  question: An AI hiring tool consistently favors male candidates over equally qualified
    female candidates. What type of bias is MOST likely present?
  options:
    A: Selection bias
    B: Historical bias
    C: Measurement bias
    D: Algorithmic bias
  correct_answer: B
- id: q8_proprietary_data
  question: Your company owns a large dataset of customer transactions. What ethical
    consideration is MOST important when using this data to train an AI model?
  options:
    A: Ensuring the data is publicly available.
    B: Obtaining explicit consent from customers for data usage.
    C: Minimizing the cost of data storage.
    D: Maximizing the model's accuracy, regardless of privacy concerns.
  correct_answer: B
- id: q9_public_data
  question: You are using publicly available data to train a model. What potential
    ethical issue should you be aware of?
  options:
    A: Public data is always ethically sound.
    B: The data may contain biases or inaccuracies.
    C: Public data is always free to use for any purpose.
    D: Public data is always of high quality.
  correct_answer: B
- id: q10_web_scraped_data
  question: You are scraping data from websites to train an AI model. What legal and
    ethical considerations are paramount?
  options:
    A: Copyright restrictions and terms of service.
    B: The speed of data collection.
    C: The size of the dataset.
    D: The model's accuracy.
  correct_answer: A
- id: q11_sensitive_info
  question: An AI model is trained on medical records. What is the MOST critical step
    to ensure ethical data handling?
  options:
    A: Anonymizing or de-identifying the data.
    B: Using the most advanced encryption algorithms.
    C: Sharing the data with research partners.
    D: Storing the data on a secure server.
  correct_answer: A
- id: q12_data_bias
  question: You discover that your training data underrepresents a specific demographic
    group. What is the potential consequence?
  options:
    A: The model will perform equally well for all groups.
    B: The model may exhibit biased predictions for the underrepresented group.
    C: The model will be more accurate overall.
    D: The model will be less complex.
  correct_answer: B
- id: q13_labeled_data_ethics
  question: Human labelers are used to annotate data for an AI model. What ethical
    concern arises regarding the labelers themselves?
  options:
    A: The cost of labeling.
    B: Potential for bias in their labeling decisions.
    C: The speed of labeling.
    D: The need for specialized skills.
  correct_answer: B
- id: q14_unlabeled_data_ethics
  question: You are using unlabeled data for unsupervised learning. What ethical risk
    should you consider?
  options:
    A: Unlabeled data is always ethically safe.
    B: The data may contain hidden biases that the model learns.
    C: Unsupervised learning is always more ethical than supervised learning.
    D: The model will not be able to make accurate predictions.
  correct_answer: B
- id: q15_unsupervised_training
  question: An unsupervised learning algorithm identifies a cluster of individuals
    based on sensitive attributes. What ethical concern arises?
  options:
    A: Unsupervised learning cannot identify sensitive attributes.
    B: The clustering may reveal discriminatory patterns.
    C: The clustering is always accurate.
    D: The clustering is irrelevant from an ethical perspective.
  correct_answer: B
- id: q16_supervised_fine_tuning
  question: You are fine-tuning a pre-trained language model. What ethical consideration
    is crucial during this process?
  options:
    A: The size of the fine-tuning dataset.
    B: Ensuring the fine-tuning data does not introduce or amplify biases.
    C: The computational cost of fine-tuning.
    D: The model's original training data.
  correct_answer: B
- id: q17_rlhf_ethics
  question: Reinforcement Learning from Human Feedback (RLHF) is used to align an
    AI model with human values. What potential ethical issue exists?
  options:
    A: Human feedback is always objective and unbiased.
    B: The human feedback may reflect societal biases.
    C: RLHF always guarantees ethical behavior.
    D: RLHF is not relevant to ethical considerations.
  correct_answer: B
- id: q18_inclusive_ai
  question: What is a key practice for developing inclusive and fair AI systems?
  options:
    A: Using only data from dominant demographic groups.
    B: Actively seeking diverse perspectives during the development process.
    C: Ignoring potential biases in the data.
    D: Focusing solely on maximizing model accuracy.
  correct_answer: B
- id: q19_foundation_model_dev
  question: As a developer of a foundation model, what is your ethical responsibility
    regarding potential misuse?
  options:
    A: You are not responsible for how others use your model.
    B: You should anticipate potential misuse and implement safeguards.
    C: Misuse is inevitable and cannot be prevented.
    D: Focus solely on the model's technical performance.
  correct_answer: B
- id: q20_open_source_data
  question: A foundation model is trained on a large corpus of open-source data. What
    ethical concern might arise?
  options:
    A: Open-source data is always ethically sound.
    B: The data may contain copyrighted material or harmful content.
    C: Open-source data is always free of bias.
    D: The model will always be accurate.
  correct_answer: B
- id: q21_ai_inconsistency
  question: An AI chatbot provides contradictory answers to the same question asked
    in slightly different ways. What ethical issue does this highlight?
  options:
    A: Lack of transparency.
    B: Potential for misinformation.
    C: Violation of user privacy.
    D: Intellectual property infringement.
  correct_answer: B
- id: q22_ai_hallucination
  question: An AI model generates information that is factually incorrect but presented
    as truth. This is known as a 'hallucination'. What is the ethical implication?
  options:
    A: It improves the model's creativity.
    B: It can lead to the spread of misinformation.
    C: It is a harmless quirk of AI models.
    D: It enhances the user experience.
  correct_answer: B
- id: q23_ai_monitoring
  question: After deploying an AI model, why is ongoing monitoring crucial from an
    ethical standpoint?
  options:
    A: To improve the model's accuracy.
    B: To detect and mitigate emerging biases or unintended consequences.
    C: To reduce the cost of maintenance.
    D: To comply with legal regulations.
  correct_answer: B
- id: q24_business_ai_access
  question: A small business wants to adopt AI but lacks the resources. What ethical
    consideration is relevant?
  options:
    A: AI is only beneficial for large corporations.
    B: Ensuring equitable access to AI technology for businesses of all sizes.
    C: Small businesses should not use AI.
    D: AI is too complex for small businesses to understand.
  correct_answer: B
- id: q25_business_ai_transparency
  question: A business uses an AI system to make decisions about loan applications.
    What is the ethical importance of transparency in this process?
  options:
    A: Transparency is not important for business decisions.
    B: Transparency allows applicants to understand why their application was approved
      or denied.
    C: Transparency is only required by law.
    D: Transparency slows down the decision-making process.
  correct_answer: B
- id: q26_individual_ai_equity
  question: How can equitable access to AI technology be promoted for individuals?
  options:
    A: By limiting access to AI education.
    B: By providing affordable AI tools and training opportunities.
    C: By focusing solely on advanced AI applications.
    D: By ignoring the digital divide.
  correct_answer: B
- id: q27_human_ai_collaboration
  question: What ethical consideration is crucial in human-AI collaboration?
  options:
    A: Replacing human workers with AI.
    B: Ensuring humans retain control and oversight of AI systems.
    C: Minimizing human involvement in decision-making.
    D: Ignoring potential biases in AI recommendations.
  correct_answer: B
- id: q28_ai_generated_outputs
  question: An individual uses an AI tool to generate creative content. What ethical
    responsibility do they have?
  options:
    A: They have no responsibility for the AI-generated content.
    B: To ensure the content does not infringe on copyright or spread misinformation.
    C: To claim the content as their own original work.
    D: To use the content for any purpose, regardless of its impact.
  correct_answer: B
- id: q29_chatgpt_privacy
