    C: ChatGPT is completely anonymous.
    D: Privacy is not a concern with ChatGPT.
  correct_answer: B
- id: q30_chatgpt_plagiarism
  question: A student submits an essay generated by ChatGPT without proper attribution.
    What ethical issue is this?
  options:
    A: It is acceptable as long as the essay is well-written.
    B: Plagiarism and academic dishonesty.
    C: ChatGPT is a legitimate research tool.
    D: The student is demonstrating creativity.
  correct_answer: B
- id: q31_gdpr_ai
