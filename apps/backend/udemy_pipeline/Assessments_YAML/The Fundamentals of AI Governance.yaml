  options:
    A: GDPR has no impact on AI systems.
    B: GDPR requires data minimization, transparency, and user consent.
    C: GDPR only applies to personal data collected before AI systems are deployed.
    D: GDPR encourages the unrestricted use of personal data for AI development.
