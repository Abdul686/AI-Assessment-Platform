- id: q1_docker_basics
  question: You need to share a machine learning model and its dependencies with a
    colleague who has a different operating system. Which benefit of Docker best addresses
    this challenge?
  options:
    A: Docker's network isolation features.
    B: Docker's image portability and consistency.
    C: Docker's resource limiting capabilities.
    D: Docker's integration with Kubernetes.
  correct_answer: B
- id: q2_flask_api
  question: In a Flask API designed to serve predictions from a machine learning model,
    what is the primary purpose of the `request` object?
  options:
    A: To manage the server's internal state.
    B: To access incoming data from the client.
    C: To handle database connections.
    D: To define the API's documentation.
  correct_answer: B
- id: q3_random_forest_deployment
  question: You've trained a Random Forest model and pickled it. When deploying it
    as an API, what is the most crucial reason to load the pickled model *within*
    the API endpoint function rather than globally?
  options:
    A: To reduce memory consumption during API startup.
    B: To ensure thread safety in a multi-threaded environment.
    C: To simplify the API code.
    D: To improve model training speed.
  correct_answer: B
- id: q4_dockerfile_commands
  question: In a Dockerfile, what is the purpose of the `EXPOSE` command?
  options:
    A: To publish a port from the container to the host machine.
    B: To specify the base image for the container.
    C: To define the working directory inside the container.
    D: To install dependencies within the container.
  correct_answer: A
- id: q5_flask_get_post
  question: You need to accept a large JSON payload from a client. Which HTTP method
    is most appropriate for this scenario in your Flask API?
  options:
    A: GET
    B: POST
    C: PUT
    D: DELETE
  correct_answer: B
- id: q6_docker_image_layers
  question: Understanding Docker image layers is crucial for efficient builds. What
    is the primary benefit of caching Docker image layers?
  options:
    A: Reduced image size.
    B: Faster build times for subsequent builds with unchanged layers.
    C: Improved container security.
    D: Automatic image updates.
