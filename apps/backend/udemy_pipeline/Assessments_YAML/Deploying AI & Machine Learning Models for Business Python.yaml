    B: Automatically generated, interactive API documentation.
    C: Enhanced API security features.
    D: Simplified database integration.
  correct_answer: B
- id: q8_random_forest_input
  question: Your Random Forest API accepts file input. What is a potential security
    concern when handling user-uploaded files, and how can you mitigate it?
  options:
    A: Denial of Service (DoS) attacks; limit file size.
    B: SQL injection; sanitize file names.
    C: Cross-Site Scripting (XSS); encode file content.
    D: Man-in-the-Middle (MITM) attacks; use HTTPS.
  correct_answer: A
- id: q9_docker_wsgi
  question: What is the role of a WSGI server (e.g., Gunicorn) in a production Dockerized
