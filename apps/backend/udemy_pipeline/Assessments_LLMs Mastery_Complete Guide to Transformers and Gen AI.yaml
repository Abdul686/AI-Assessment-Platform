  options:
    A: Reducing the learning rate.
    B: Eliminating redundant copies of model parameters across GPUs.
    C: Increasing the batch size.
    D: Simplifying the model architecture.
  correct_answer: B
- id: q33_fsdp_communication
  question: In FSDP, how is communication between GPUs handled?
  options:
    A: All GPUs broadcast their entire model parameters to each other.
    B: Only the necessary parameters are communicated between GPUs during forward
      and backward passes.
    C: Communication is disabled to reduce overhead.
    D: Communication is handled by a central server.
  correct_answer: B
- id: q34_transformer_encoder
  question: What is the primary function of the encoder in a Transformer model?
  options:
    A: To generate text.
    B: To process the input sequence and create a contextualized representation.
