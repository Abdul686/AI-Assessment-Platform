    D: To perform tokenization.
  correct_answer: B
- id: q35_transformer_decoder
  question: What is the primary function of the decoder in a Transformer model?
  options:
    A: To process the input sequence.
    B: To generate the output sequence based on the encoder's output.
    C: To perform tokenization.
    D: To calculate attention weights.
  correct_answer: B
- id: q36_attention_mechanism
  question: 'The attention mechanism in Transformers allows the model to:'
  options:
    A: Ignore irrelevant parts of the input sequence.
    B: Focus on different parts of the input sequence when processing each element.
    C: Reduce the dimensionality of the input sequence.
    D: Parallelize computations.
  correct_answer: B
