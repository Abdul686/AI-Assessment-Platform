<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluation - Aziro L&amp;D</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
    .summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;box-shadow:var(--shadow-xs)}
    .summary-value{font-size:24px;font-weight:800;color:var(--text);line-height:1}
    .summary-label{font-size:12px;color:var(--text3);margin-top:6px}
    .hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-bottom:22px}
    .detail-list{display:grid;gap:10px}
    .detail-item{padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--border);font-size:13px;color:var(--text2)}
    .detail-item strong{display:block;color:var(--text);margin-bottom:4px}
    .answers-wrap{display:grid;gap:14px}
    .answer-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-xs)}
    .answer-card.correct{border-left:4px solid var(--success)}
    .answer-card.incorrect{border-left:4px solid var(--danger)}
    .answer-title{font-size:15px;font-weight:700;margin-bottom:12px;color:var(--text)}
    .answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .answer-chip{padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);font-size:13px;color:var(--text2)}
    .empty-state{padding:34px 20px;text-align:center;color:var(--text3)}
    @media (max-width: 980px){.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-grid{grid-template-columns:1fr}.answer-grid{grid-template-columns:1fr}}
    @media (max-width: 640px){.summary-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="breadcrumb">Home &gt; Reports &gt; Evaluation</div>
        <div class="page-title">Evaluation &amp; Results</div>
      </div>
      <div class="topbar-right">
        <a href="reports.html" class="export-btn">Back To Reports</a>
      </div>
    </div>
    <div class="content" id="evaluationContent">
      <div class="card"><div class="empty-state">Loading evaluation details...</div></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="../js/sidebar.js"></script>
<script src="../js/api-config.js"></script>
<script src="../js/main.js"></script>
<script>
  let API_BASE_URL = "";

  function escapeHtml(text) {
    return String(text || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  }

  function formatDate(value) {
    if (!value) return "-";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return value;
    return date.toLocaleString();
  }

  function getStatusBadge(status) {
    return status === "Pass" ? "badge-pass" : "badge-fail";
  }

  function renderEvaluation(payload) {
    const summary = payload.summary;
    const assignment = payload.assignment;
    const test = payload.test;
    const answers = payload.answers || [];

    document.getElementById("evaluationContent").innerHTML = `
      <div class="hero-grid anim-1">
        <div class="card">
          <div class="card-header"><div><div class="card-title">Candidate Summary</div><div class="card-subtitle">Overall result for the submitted assessment</div></div></div>
          <div class="detail-list">
            <div class="detail-item"><strong>Candidate</strong>${escapeHtml(assignment.candidateName)} (${escapeHtml(assignment.candidateEmail)})</div>
            <div class="detail-item"><strong>Course</strong>${escapeHtml(test.courseName)}</div>
            <div class="detail-item"><strong>Branch</strong>${escapeHtml(assignment.branch || "No branch")}</div>
            <div class="detail-item"><strong>Submitted</strong>${escapeHtml(formatDate(assignment.submittedAt))}</div>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><div><div class="card-title">Assessment Settings</div><div class="card-subtitle">Configuration snapshot used for this test</div></div></div>
          <div class="detail-list">
            <div class="detail-item"><strong>Question Type</strong>${escapeHtml(test.questionType || "MCQ Only")}</div>
            <div class="detail-item"><strong>Difficulty</strong>${escapeHtml(test.difficultyLevel || "Not set")}</div>
            <div class="detail-item"><strong>Time Limit</strong>${escapeHtml(String(test.timeLimit || "Not set"))} minutes</div>
            <div class="detail-item"><strong>Status</strong><span class="badge ${getStatusBadge(summary.status)}">${escapeHtml(summary.status)}</span></div>
          </div>
        </div>
      </div>

      <div class="summary-grid anim-2">
        <div class="summary-card"><div class="summary-value">${escapeHtml(String(summary.score || 0))}/${escapeHtml(String(summary.totalQuestions || 0))}</div><div class="summary-label">Overall Score</div></div>
        <div class="summary-card"><div class="summary-value">${escapeHtml(String(summary.percentage || 0))}%</div><div class="summary-label">Percentage</div></div>
        <div class="summary-card"><div class="summary-value">${escapeHtml(String(summary.correctCount || 0))}</div><div class="summary-label">Correct Answers</div></div>
        <div class="summary-card"><div class="summary-value">${escapeHtml(String(summary.incorrectCount || 0))}</div><div class="summary-label">Incorrect Answers</div></div>
      </div>

      <div class="card anim-3">
        <div class="card-header"><div><div class="card-title">Question-by-Question Review</div><div class="card-subtitle">Selected answer versus the correct answer for each MCQ</div></div></div>
        <div class="answers-wrap">
          ${answers.map((answer) => `
            <div class="answer-card ${answer.isCorrect ? "correct" : "incorrect"}">
              <div class="answer-title">Q${escapeHtml(String(answer.order))}. ${escapeHtml(answer.question)}</div>
              <div class="answer-grid">
                <div class="answer-chip"><strong>Selected Answer</strong><div>${escapeHtml(answer.selectedAnswer ? `${answer.selectedAnswer}: ${answer.selectedAnswerText}` : "Not answered")}</div></div>
                <div class="answer-chip"><strong>Correct Answer</strong><div>${escapeHtml(answer.correctAnswer ? `${answer.correctAnswer}: ${answer.correctAnswerText}` : "-")}</div></div>
              </div>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }

  async function loadEvaluation() {
    const params = new URLSearchParams(window.location.search);
    const assignmentId = params.get("assignmentId");

    if (!assignmentId) {
      document.getElementById("evaluationContent").innerHTML = '<div class="card"><div class="empty-state">No assignment selected. Open this page from Reports or Generated Tests.</div></div>';
      return;
    }

    try {
      API_BASE_URL = await window.AziroConfig.resolveApiBaseUrl();
      const response = await fetch(`${API_BASE_URL}/api/results/${encodeURIComponent(assignmentId)}`);
      const payload = await response.json();
      if (!response.ok) {
        throw new Error(payload.detail || "Failed to load evaluation details.");
      }
      renderEvaluation(payload);
    } catch (error) {
      document.getElementById("evaluationContent").innerHTML = `<div class="card"><div class="empty-state">${escapeHtml(error.message || "Failed to load evaluation details.")}</div></div>`;
      showToast(error.message || "Failed to load evaluation details.", "error");
    }
  }

  document.addEventListener("DOMContentLoaded", loadEvaluation);
</script>
</body>
</html>
