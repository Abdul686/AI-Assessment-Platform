<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Test - Aziro L&amp;D Platform</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .page-wrap { max-width: 860px; }
    .review-section {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }
    .review-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .review-item {
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text2);
    }
    .review-item strong {
      color: var(--text);
    }
    .review-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 20px;
    }
    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 24px;
      margin-top: 8px;
    }
    .btn-back {
      padding: 11px 22px;
      background: transparent;
      color: var(--text2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      font-family: "DM Sans", sans-serif;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .btn-back:hover {
      background: var(--surface2);
      color: var(--text);
    }
    .btn-generate {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: var(--accent4);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s;
      font-family: "DM Sans", sans-serif;
    }
    .btn-generate:hover {
      background: var(--orange-dark);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(53, 92, 168, 0.28);
    }
    @media (max-width: 720px) {
      .review-grid {
        grid-template-columns: 1fr;
      }
      .action-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-back,
      .btn-generate {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

<div class="app-shell">
  <div id="sidebar-mount"></div>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div class="breadcrumb">Home &gt; Create Test &gt; Review</div>
        <div class="page-title">Review Test Details</div>
      </div>
    </div>

    <div class="content page-wrap">
      <div class="review-section">
        <div class="review-title">Selected Course</div>
        <div id="reviewCourse" class="review-item"></div>
      </div>

      <div class="review-section">
        <div class="review-title">Test Configuration</div>
        <div id="reviewConfig" class="review-grid"></div>
      </div>

      <div class="review-section">
        <div class="review-title">Delivery Settings</div>
        <div id="reviewDelivery" class="review-grid"></div>
      </div>

      <div class="review-section">
        <div class="review-title">Candidates</div>
        <div id="reviewCandidates"></div>
      </div>

      <div class="action-bar">
        <a href="create_test.html" class="btn-back" onclick="event.preventDefault(); goBack();">Back</a>
        <button class="btn-generate" type="button" onclick="generateTest()">Generate Test Link &amp; Send</button>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>
<script src="../js/sidebar.js"></script>
<script src="../js/api-config.js"></script>
<script src="../js/main.js"></script>
<script>
  let API_BASE_URL = "";
  let hasReviewData = false;

  function addReviewItem(container, label, value) {
    const item = document.createElement("div");
    item.className = "review-item";
    const strong = document.createElement("strong");
    strong.textContent = `${label}:`;
    item.appendChild(strong);
    item.appendChild(document.createTextNode(` ${value || "-"}`));
    container.appendChild(item);
  }

  function loadReviewData() {
    const course = localStorage.getItem("testCourse");
    const config = JSON.parse(localStorage.getItem("testConfig") || "{}");
    const candidates = JSON.parse(localStorage.getItem("testCandidates") || "[]");

    if (!course) {
      hasReviewData = false;
      document.getElementById("reviewCourse").textContent =
        "No test details found. Create a test first to review it here.";
      document.getElementById("reviewConfig").innerHTML = "";
      document.getElementById("reviewDelivery").innerHTML = "";
      document.getElementById("reviewCandidates").innerHTML =
        '<div class="review-item">No candidates loaded.</div>';
      showToast("No saved test details found.", "error");
      return;
    }

    hasReviewData = true;
    document.getElementById("reviewCourse").textContent = course;

    const configContainer = document.getElementById("reviewConfig");
    configContainer.innerHTML = "";
    addReviewItem(configContainer, "Question Type", config.questionType);
    addReviewItem(configContainer, "No. of Questions", config.questionCount);
    addReviewItem(configContainer, "Time Limit", config.timeLimit ? `${config.timeLimit} mins` : "");
    addReviewItem(configContainer, "Aptitude Test", config.aptitudeEnabled);
    addReviewItem(configContainer, "Difficulty Level", config.difficultyLevel);

    const deliveryContainer = document.getElementById("reviewDelivery");
    deliveryContainer.innerHTML = "";
    addReviewItem(deliveryContainer, "Send Method", config.sendMethod);
    addReviewItem(deliveryContainer, "Link Expiry", config.linkExpiry);
    addReviewItem(deliveryContainer, "Custom Message", config.customMessage || "Default template");

    const candidatesContainer = document.getElementById("reviewCandidates");
    candidatesContainer.innerHTML = "";
    candidates.forEach((candidate, index) => {
      const item = document.createElement("div");
      item.className = "review-item";
      const strong = document.createElement("strong");
      strong.textContent = `${index + 1}. ${candidate.name}`;
      item.appendChild(strong);
      item.appendChild(
        document.createTextNode(
          ` (${candidate.email}) - ID: ${candidate.employeeId || "N/A"} - Branch: ${candidate.branch || "N/A"}`
        )
      );
      candidatesContainer.appendChild(item);
    });
  }

  function goBack() {
    window.location.href = "create_test.html";
  }

  function getFrontendBaseUrl() {
    const currentUrl = new URL(window.location.href);
    currentUrl.pathname = currentUrl.pathname.replace(/\/review_test\.html$/, "/take_test.html");
    currentUrl.search = "";
    currentUrl.hash = "";
    return currentUrl.toString();
  }

  async function generateTest() {
    if (!hasReviewData) {
      showToast("Please create a test before generating links.", "error");
      setTimeout(() => {
        window.location.href = "create_test.html";
      }, 1000);
      return;
    }

    const button = document.querySelector(".btn-generate");
    const originalLabel = button.textContent;
    button.disabled = true;
    button.textContent = "Generating...";

    try {
      API_BASE_URL = await window.AziroConfig.resolveApiBaseUrl();
      const course = localStorage.getItem("testCourse");
      const config = JSON.parse(localStorage.getItem("testConfig") || "{}");
      const candidates = JSON.parse(localStorage.getItem("testCandidates") || "[]");

      const response = await fetch(`${API_BASE_URL}/api/tests`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          course,
          config: {
            ...config,
            questionCount: Number(config.questionCount || 0),
            timeLimit: config.timeLimit ? Number(config.timeLimit) : null,
          },
          candidates,
          frontendBaseUrl: getFrontendBaseUrl(),
        }),
      });

      const payload = await response.json();
      if (!response.ok) {
        throw new Error(payload.detail || "Failed to create test.");
      }

      localStorage.setItem("latestGeneratedTest", JSON.stringify(payload));
      showToast(
        `${payload.assignments.length} test link${payload.assignments.length > 1 ? "s" : ""} generated successfully.`,
        "success"
      );
      setTimeout(() => {
        window.location.href = "generated_tests.html";
      }, 900);
    } catch (error) {
      showToast(error.message || "Failed to generate test.", "error");
    } finally {
      button.disabled = false;
      button.textContent = originalLabel;
    }
  }

  document.addEventListener("DOMContentLoaded", loadReviewData);
</script>
</body>
</html>
